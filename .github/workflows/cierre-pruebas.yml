name: Cierre de Luque en datos simulados
on:
  push:
    branches: [pruebas/cierre-fiable-luque]
permissions:
  contents: read
jobs:
  cierre:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: node --test pruebas/cierre.test.cjs
      - run: python -m pip install playwright==1.55.0
      - run: python pruebas/movil.py
